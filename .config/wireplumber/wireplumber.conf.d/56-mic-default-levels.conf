# Fallback input levels for known USB microphones, used only when WirePlumber
# has no stored route volume yet (fresh install or cleared
# ~/.local/state/wireplumber/default-routes). Values are linear channel volumes,
# measured for dictation on 2026-10-09:
# - FIFINE K670: hardware gain defaults to +34 dB and clips hard on speech;
#   0.0795 (wpctl 0.43) puts the mixer at +12 dB.
# - NewEye 60 webcam: quiet even at hardware maximum (0 dB); 4.096 (wpctl 1.6)
#   adds +12 dB in software without clipping.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card\\.usb-FIFINE.*K670.*" } ]
    actions = { update-props = { device.routes.default-source-volume = 0.0795 } }
  }
  {
    matches = [ { device.name = "~alsa_card\\.usb-NewEye_60.*" } ]
    actions = { update-props = { device.routes.default-source-volume = 4.096 } }
  }
]
