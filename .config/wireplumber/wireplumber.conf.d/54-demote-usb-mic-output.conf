# Keep USB microphones from grabbing the default audio *output*.
#
# Many USB microphones (e.g. FIFINE K670) expose an analog-stereo output sink
# for zero-latency headphone monitoring. PipeWire gives it a high node priority
# (~1109), so plugging the mic in makes it the default sink and audio silently
# moves off the speaker/monitor to the mic's headphone jack.
#
# Demote any USB microphone output sink below the laptop speaker (1000) so it is
# never auto-selected as default. It stays a manual target in pwvucontrol if the
# monitoring jack is actually used. Matches by "usb-...Microphone..." so it is
# independent of the specific model / device number.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output\\.usb-.*[Mm]icrophone.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 200
        priority.session = 200
      }
    }
  }
]
