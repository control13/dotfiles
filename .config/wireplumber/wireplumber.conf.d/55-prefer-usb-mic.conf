# Prefer a dedicated USB microphone (e.g. FIFINE K670) as default input.
#
# USB webcams (NewEye 60) and USB mics both get ~2109 from PipeWire, so without
# this the winner between them is arbitrary. Boost any USB source whose name
# contains "Microphone" above every other input; the webcam stays the fallback
# when docked, the high-passed internal mic (2050) when nothing is plugged in.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-.*[Mm]icrophone.*" }
    ]
    actions = {
      update-props = {
        priority.driver  = 2200
        priority.session = 2200
      }
    }
  }
]
