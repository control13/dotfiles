# High-passed copy of the internal microphone as a separate source.
#
# The washburne DMIC (acp63) carries a large DC offset (about -0.1 / -0.37 of
# full scale per channel, -0.24 in a mono downmix). Speech detectors that do not
# high-pass their input see only the offset: sotto's Silero VAD dropped every
# frame, so nothing was ever transcribed. WebRTC apps are unaffected because they
# high-pass internally.
#
# Priority 2050 ranks it just above the raw DMIC (2000) but below USB sources
# (webcam ~2109, USB mics boosted in wireplumber rule 55), so it becomes the
# default only when nothing external is plugged in. Dictation (voxtype) follows
# the default.
# The capture side is passive, so the mic is only opened while something
# records from this source.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Internal Microphone (high-pass)"
      media.name       = "Internal Microphone (high-pass)"
      filter.graph = {
        nodes = [
          { type = builtin name = highpass label = bq_highpass control = { "Freq" = 80.0 } }
        ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name      = "capture.internal_mic_highpass"
        node.passive   = true
        target.object  = "alsa_input.pci-0000_c4_00.6.HiFi__Mic1__source"
        stream.dont-remix = true
      }
      playback.props = {
        node.name        = "internal_mic_highpass"
        media.class      = "Audio/Source"
        priority.session = 2050
        priority.driver  = 2050
      }
    }
  }
]
