[Unit]
Description=Timer for Profile-sync-daemon - 10min

[Timer]
# An empty assignment clears the unit's whole timer list, including the packaged
# OnCalendar=hourly. OnUnitActiveSec alone never fires, because it anchors on a
# previous activation of psd-resync.service and that service had never run --
# the timer stayed in state "elapsed" with no next trigger. OnActiveSec provides
# the missing first anchor, relative to the timer starting at login.
OnUnitActiveSec=
OnActiveSec=10min
OnUnitActiveSec=10min
